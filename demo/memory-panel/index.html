<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSM Memory Panel</title>
  <style>
    :root { --bg:#0b1020; --panel:#121933; --panel2:#0f1530; --text:#eaf0ff; --muted:#98a4c7; --line:#243055; --accent:#7aa2ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:linear-gradient(180deg,#0a0f1f,#0b1020 30%,#08101d); color:var(--text); }
    .wrap { max-width:1440px; margin:0 auto; padding:24px; }
    h1 { margin:0 0 6px; font-size:28px; }
    .sub { color:var(--muted); margin-bottom:18px; }
    .toolbar { display:grid; grid-template-columns:1fr auto auto; gap:10px; margin-bottom:10px; }
    .presets { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .input,.btn,.preset { border-radius:12px; border:1px solid var(--line); background:rgba(18,25,51,.95); color:var(--text); padding:12px 14px; font-size:14px; }
    .btn,.preset { cursor:pointer; background:linear-gradient(180deg,#1a2650,#152043); }
    .preset { padding:8px 12px; font-size:13px; }
    .status { color:var(--muted); font-size:13px; margin-bottom:14px; min-height:18px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
    .card,.panel { background:rgba(18,25,51,.92); border:1px solid var(--line); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    .card { padding:16px; }
    .label { color:var(--muted); font-size:13px; margin-bottom:8px; }
    .value { font-size:28px; font-weight:700; }
    .grid { display:grid; grid-template-columns:1.1fr 1fr; gap:18px; }
    .panel { padding:18px; }
    .panel h2 { margin:0 0 14px; font-size:20px; }
    .list { display:grid; gap:12px; }
    .item { padding:14px; background:rgba(15,21,48,.96); border:1px solid var(--line); border-radius:14px; }
    .item-top { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:13px; color:var(--muted); }
    .badge { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:4px 10px; color:var(--text); background:rgba(122,162,255,.08); }
    .summary { line-height:1.55; font-size:14px; margin-bottom:8px; }
    .meta { color:var(--muted); font-size:12px; line-height:1.5; word-break:break-all; }
    .why { margin-top:8px; display:flex; flex-wrap:wrap; gap:8px; }
    .chip { font-size:12px; color:#d8e4ff; background:rgba(122,162,255,.12); border:1px solid rgba(122,162,255,.2); border-radius:999px; padding:4px 8px; }
    .querybox { margin-bottom:14px; padding:14px; border-radius:14px; background:rgba(122,162,255,.08); border:1px solid rgba(122,162,255,.2); }
    .small { font-size:12px; color:var(--muted); }
    @media (max-width:980px) { .toolbar{grid-template-columns:1fr;} .stats{grid-template-columns:repeat(2,minmax(0,1fr));} .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>OSM Memory Panel</h1>
    <div class="sub">OpenClaw Semantic Memory · recent memories + retrieval snapshots</div>
    <div class="toolbar">
      <input id="queryInput" class="input" value="向量记忆系统现在是什么状态？" placeholder="输入 query / 或点击下方预设" />
      <button id="loadBtn" class="btn">Load Query Snapshot</button>
      <button id="refreshBtn" class="btn">Load Latest</button>
    </div>
    <div id="presets" class="presets"></div>
    <div id="status" class="status"></div>
    <div id="stats" class="stats"></div>
    <div class="grid">
      <section class="panel">
        <h2>Recent Ephemeral Memories</h2>
        <div class="list" id="recent"></div>
      </section>
      <section class="panel">
        <h2>Retrieval Snapshot</h2>
        <div class="querybox" id="querybox"></div>
        <div class="list" id="retrieval"></div>
      </section>
    </div>
  </div>
  <script>
    document.getElementById('loadBtn').addEventListener('click', loadFromInput);
    document.getElementById('refreshBtn').addEventListener('click', () => loadJson('./data.json', '已加载最新 snapshot'));
    document.getElementById('queryInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadFromInput(); });

    async function boot() {
      const queryIndex = await fetchJson('./queries.json?_=' + Date.now()).catch(() => ({queries: []}));
      renderPresets(queryIndex.queries || []);
      await loadJson('./data.json', '已加载最新 snapshot');
    }

    async function loadFromInput() {
      const query = document.getElementById('queryInput').value.trim();
      const queryIndex = await fetchJson('./queries.json?_=' + Date.now()).catch(() => ({queries: []}));
      const found = (queryIndex.queries || []).find(x => x.query === query);
      if (!found) {
        setStatus('当前 query 还没有预生成 snapshot。先用 generate-panel-data.sh 生成。');
        return;
      }
      await loadJson('./' + found.file, `已加载 query snapshot: ${found.query}`);
    }

    function renderPresets(items) {
      const host = document.getElementById('presets');
      host.innerHTML = items.map(item => `<button class="preset" data-file="${item.file}" data-query="${escapeHtml(item.query)}">${escapeHtml(item.query)}</button>`).join('');
      host.querySelectorAll('.preset').forEach(btn => {
        btn.addEventListener('click', () => {
          const q = btn.getAttribute('data-query');
          const file = btn.getAttribute('data-file');
          document.getElementById('queryInput').value = q;
          loadJson('./' + file, '已加载预设 snapshot: ' + q);
        });
      });
    }

    async function loadJson(url, statusText) {
      setStatus(statusText);
      const data = await fetchJson(url + '?_=' + Date.now());
      render(data);
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('fetch failed: ' + res.status);
      return await res.json();
    }

    function render(data) {
      const stats = [
        ['Persistent Total', data.persistent.total],
        ['Ephemeral Total', data.ephemeral.total],
        ['Ephemeral Overdue', data.ephemeral.overdue],
        ['Avg Confidence', data.ephemeral.avgConfidence?.toFixed?.(4) ?? data.ephemeral.avgConfidence],
      ];
      document.getElementById('stats').innerHTML = stats.map(([label, value]) => `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`).join('');
      document.getElementById('recent').innerHTML = data.ephemeral.recent.map(item => `<article class="item"><div class="item-top"><span class="badge">${item.memoryType}</span><span>conf=${item.confidence}</span></div><div class="summary">${escapeHtml(item.summary)}</div><div class="meta">session: ${escapeHtml(item.sessionId)}<br/>created: ${item.createdAt}<br/>expires: ${item.expiresAt}<br/>citation: ${escapeHtml(item.citation)}</div></article>`).join('');
      if (data.retrieval) {
        document.getElementById('querybox').innerHTML = `<div><strong>Query:</strong> ${escapeHtml(data.retrieval.query)}</div><div class="small">debug: ${escapeHtml(JSON.stringify(data.retrieval.debug || {}))}</div>`;
        document.getElementById('retrieval').innerHTML = data.retrieval.results.map(item => `<article class="item"><div class="item-top"><span class="badge">${item.memoryType}</span><span>score=${item.score} · conf=${item.confidence}</span></div><div class="summary">${escapeHtml(item.summary)}</div><div class="meta">citation: ${escapeHtml(item.citation)}</div><div class="why">${item.whyMatched.map(w => `<span class="chip">${escapeHtml(w)}</span>`).join('')}</div></article>`).join('');
      }
    }

    function setStatus(text) { document.getElementById('status').textContent = text; }
    function escapeHtml(s) { return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
    boot().catch(err => { document.body.innerHTML = '<pre style="color:#fff;padding:24px">' + String(err) + '</pre>'; });
  </script>
</body>
</html>
